<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Last Stand: Survival</title><style>
*{box-sizing:border-box}body{margin:0;background:#10150f;color:#f1ffe9;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{width:min(960px,96vw)}header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}h1{color:#b7ff78;margin:10px 0}button{border:0;border-radius:9px;padding:10px 15px;background:#b7ff78;font-weight:bold;cursor:pointer}canvas{width:100%;background:#1a281a;border:2px solid #55764b;border-radius:12px;display:block}p{color:#c0d5b7}kbd{background:#2e442d;padding:2px 6px;border-radius:4px}
</style></head><body><main><header><h1>☠️ LAST STAND: SURVIVAL</h1><div>Score <b id="score">0</b> · HP <b id="hp">100</b> · Wave <b id="wave">1</b> <button id="start">Play / Restart</button></div></header><canvas id="g" width="900" height="560"></canvas><p>Move with <kbd>WASD</kbd> or arrow keys. Aim with your mouse; hold click to shoot. Collect green medkits and gold upgrades. Survive as long as you can!</p></main><script>
const c=document.querySelector('#g'),ctx=c.getContext('2d');let keys={},mouse={x:450,y:280,down:false},p,enemies,bullets,items,score,wave,hp,frame,active=false,ended=false,best=+(localStorage.lssBest||0);function start(){p={x:450,y:280,r:15,speed:3.4,fire:0,damage:1};enemies=[];bullets=[];items=[];score=0;wave=1;hp=100;frame=0;active=true;ended=false;updateHud()}document.querySelector('#start').onclick=start;
onkeydown=e=>{keys[e.key.toLowerCase()]=true};onkeyup=e=>keys[e.key.toLowerCase()]=false;c.onpointermove=e=>{const r=c.getBoundingClientRect();mouse.x=(e.clientX-r.left)*900/r.width;mouse.y=(e.clientY-r.top)*560/r.height};c.onpointerdown=()=>mouse.down=true;onpointerup=()=>mouse.down=false;
function updateHud(){document.querySelector('#score').textContent=score;document.querySelector('#hp').textContent=Math.max(0,Math.round(hp));document.querySelector('#wave').textContent=wave}
function circle(o,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fill()}
function end(){active=false;ended=true;if(score>best){best=score;localStorage.lssBest=best}draw()}
function draw(){ctx.clearRect(0,0,900,560);ctx.fillStyle='#1a281a';ctx.fillRect(0,0,900,560);ctx.strokeStyle='#243b24';for(let x=0;x<900;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,560);ctx.stroke()}for(let y=0;y<560;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(900,y);ctx.stroke()}for(const it of items){circle(it,it.type==='med'?'#75ff9a':'#ffd45c');ctx.fillStyle='#142114';ctx.textAlign='center';ctx.font='bold 14px system-ui';ctx.fillText(it.type==='med'?'+':'↑',it.x,it.y+5)}for(const b of bullets)circle(b,'#ffe68a');for(const e of enemies){circle(e,'#ff5a55');ctx.fillStyle='#451d1d';ctx.fillRect(e.x-10,e.y-4,20,5)}if(p){circle(p,'#b7ff78');ctx.strokeStyle='#eaffdc';ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(mouse.x,mouse.y);ctx.stroke()}if(!active){ctx.fillStyle='#081008dd';ctx.fillRect(0,0,900,560);ctx.textAlign='center';ctx.fillStyle=ended?'#ff7770':'#b7ff78';ctx.font='bold 42px system-ui';ctx.fillText(ended?'GAME OVER':'READY TO SURVIVE',450,250);ctx.fillStyle='white';ctx.font='20px system-ui';ctx.fillText(ended?'Score: '+score+' · Best: '+best:'Press Play / Restart to begin',450,292)}}
function tick(){if(active){frame++;if(frame%600===0)wave++;if(frame%Math.max(12,45-wave*3)===0){const side=Math.floor(Math.random()*4),pos=side===0?[0,Math.random()*560]:side===1?[900,Math.random()*560]:side===2?[Math.random()*900,0]:[Math.random()*900,560];enemies.push({x:pos[0],y:pos[1],r:11+Math.min(7,wave),speed:1+Math.random()*.45+wave*.06,hp:1+Math.floor(wave/4),hit:0})}if(frame%500===0)items.push({x:40+Math.random()*820,y:40+Math.random()*480,r:12,type:Math.random()<.6?'med':'boost'});
p.x+=((keys.arrowright||keys.d)?p.speed:0)-((keys.arrowleft||keys.a)?p.speed:0);p.y+=((keys.arrowdown||keys.s)?p.speed:0)-((keys.arrowup||keys.w)?p.speed:0);p.x=Math.max(p.r,Math.min(900-p.r,p.x));p.y=Math.max(p.r,Math.min(560-p.r,p.y));p.fire--;if(mouse.down&&p.fire<=0){const a=Math.atan2(mouse.y-p.y,mouse.x-p.x);bullets.push({x:p.x,y:p.y,vx:Math.cos(a)*8,vy:Math.sin(a)*8,r:4,damage:p.damage});p.fire=10}
for(const b of bullets){b.x+=b.vx;b.y+=b.vy}bullets=bullets.filter(b=>b.x>-10&&b.x<910&&b.y>-10&&b.y<570);for(const e of enemies){const a=Math.atan2(p.y-e.y,p.x-e.x);e.x+=Math.cos(a)*e.speed;e.y+=Math.sin(a)*e.speed;if(Math.hypot(p.x-e.x,p.y-e.y)<p.r+e.r&&e.hit<=0){hp-=8;e.hit=30}else e.hit--}
for(const b of bullets){for(const e of enemies){if(e.hp>0&&Math.hypot(b.x-e.x,b.y-e.y)<e.r+b.r){e.hp-=b.damage;b.x=-100;if(e.hp<=0)score+=10}}}enemies=enemies.filter(e=>e.hp>0);for(const it of items){if(Math.hypot(p.x-it.x,p.y-it.y)<p.r+it.r){if(it.type==='med')hp=Math.min(100,hp+25);else{p.damage=Math.min(4,p.damage+1);p.fire=Math.min(p.fire,2)}it.got=true}}items=items.filter(i=>!i.got);score+=.05;if(hp<=0){updateHud();end();return}updateHud()}draw();requestAnimationFrame(tick)}start();active=false;draw();tick();
</script></body></html>
